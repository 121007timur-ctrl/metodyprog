name: Doxygen Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install doxygen
      - name: Generate Documentation
        run: doxygen Doxyfile 2>&1 | tee doxygen.log
      - name: Check for Warnings
        run: |
          if grep -q "warning:" doxygen.log; then
            echo "❌ Doxygen found warnings:"
            grep "warning:" doxygen.log
            exit 1
          else
            echo "✅ No Doxygen warnings found"
          fi
      - name: Upload Documentation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: docs/html
